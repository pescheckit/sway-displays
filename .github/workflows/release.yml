name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts

      - name: Update version in script
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # Remove v prefix if present
          sed -i "s/^VERSION=\".*\"/VERSION=\"$VERSION\"/" sway-displays
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update debian changelog
        run: |
          DATE=$(date -R)
          printf '%s\n' \
            "sway-displays (${{ env.VERSION }}-1) unstable; urgency=medium" \
            "" \
            "  * Release ${{ env.VERSION }}" \
            "" \
            " -- Bram <bram+sway@pescheck.io>  $DATE" \
            > debian/changelog

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          mv ../sway-displays_${{ env.VERSION }}-1_all.deb dist/sway-displays_${{ env.VERSION }}_all.deb
          cp sway-displays dist/
          cd dist
          sha256sum sway-displays > sway-displays.sha256
          sha256sum sway-displays_${{ env.VERSION }}_all.deb > sway-displays_${{ env.VERSION }}_all.deb.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  publish-apt:
    name: Publish APT Repository
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Initialize gh-pages if needed
        run: |
          if [ ! -d "gh-pages" ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Setup reprepro config
        run: |
          mkdir -p gh-pages/apt/conf
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | sed 's/.*\/\([^ ]*\) .*/\1/')
          printf '%s\n' \
            "Origin: PesCheckIT" \
            "Label: sway-displays" \
            "Codename: stable" \
            "Architectures: amd64" \
            "Components: main" \
            "Description: Sway Displays Package Repository" \
            "SignWith: ${GPG_KEY_ID}" \
            > gh-pages/apt/conf/distributions

      - name: Add packages to repository
        run: |
          cd gh-pages/apt
          for deb in ../../artifacts/*.deb; do
            PKG_NAME=$(dpkg-deb -f "$deb" Package)
            reprepro remove stable "$PKG_NAME" 2>/dev/null || true
            reprepro includedeb stable "$deb"
          done

      - name: Export GPG public key
        run: |
          gpg --armor --export > gh-pages/gpg.key

      - name: Create index page
        run: |
          cat > gh-pages/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><title>Sway Displays APT Repository</title></head>
          <body>
            <h1>Sway Displays APT Repository</h1>
            <pre>
          # Import GPG key
          curl -fsSL https://pescheckit.github.io/sway-displays/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/sway-displays.gpg

          # Add repository
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/sway-displays.gpg] https://pescheckit.github.io/sway-displays/apt stable main" | \
            sudo tee /etc/apt/sources.list.d/sway-displays.list

          # Install
          sudo apt update
          sudo apt install sway-displays
            </pre>
          </body>
          </html>
          HTMLEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages

  create-release:
    needs: [build-deb, publish-apt]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # Remove v prefix if present
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./dist

      - name: Add install script
        run: cp install.sh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ env.VERSION }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/sway-displays
            dist/sway-displays.sha256
            dist/install.sh
          generate_release_notes: true
          body: |
            ## Installation

            ### APT Repository (Debian/Ubuntu) — recommended
            ```bash
            # Add signing key
            curl -fsSL https://pescheckit.github.io/sway-displays/gpg.key \
              | sudo gpg --dearmor -o /usr/share/keyrings/sway-displays.gpg

            # Add repository
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/sway-displays.gpg] \
            https://pescheckit.github.io/sway-displays/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/sway-displays.list

            sudo apt update && sudo apt install sway-displays
            ```

            ### Manual .deb install
            ```bash
            wget https://github.com/pescheckit/sway-displays/releases/download/${{ github.ref_name }}/sway-displays_${{ env.VERSION }}_all.deb
            sudo dpkg -i sway-displays_${{ env.VERSION }}_all.deb
            sudo apt-get install -f
            ```

            ### Arch Linux (AUR)
            ```bash
            yay -S sway-displays
            ```

            ### Manual Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/pescheckit/sway-displays/${{ github.ref_name }}/install.sh | bash
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-aur:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Check if AUR secret exists
        id: check-secret
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "$AUR_SSH_KEY" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "AUR_SSH_KEY not set, skipping AUR update"
          fi

      - name: Checkout
        if: steps.check-secret.outputs.exists == 'true'
        uses: actions/checkout@v4

      - name: Get version
        if: steps.check-secret.outputs.exists == 'true'
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # Remove v prefix if present
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update AUR package
        if: steps.check-secret.outputs.exists == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' "Host aur.archlinux.org" "  IdentityFile ~/.ssh/aur" "  User aur" >> ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          # Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/sway-displays.git aur-repo
          cd aur-repo

          # Update PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${{ env.VERSION }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          # Update source URL
          sed -i "s|source=.*|source=(\"sway-displays-${{ env.VERSION }}.tar.gz::https://github.com/pescheckit/sway-displays/archive/refs/tags/${{ env.VERSION }}.tar.gz\")|" PKGBUILD

          # Ensure prepare() function exists to patch VERSION in script
          if ! grep -q 'prepare()' PKGBUILD; then
            sed -i '/^package()/i prepare() {\n    cd "$srcdir/$pkgname-$pkgver"\n    sed -i "s/^VERSION=\\".*\\"/VERSION=\\"$pkgver\\"/" sway-displays\n}\n' PKGBUILD
          fi

          # Generate .SRCINFO
          {
            echo "pkgbase = sway-displays"
            echo $'\t'"pkgdesc = Display manager for Sway window manager"
            echo $'\t'"pkgver = ${{ env.VERSION }}"
            echo $'\t'"pkgrel = 1"
            echo $'\t'"url = https://github.com/pescheckit/sway-displays"
            echo $'\t'"arch = any"
            echo $'\t'"license = MIT"
            echo $'\t'"depends = bash"
            echo $'\t'"depends = jq"
            echo $'\t'"depends = bc"
            echo $'\t'"depends = sway"
            echo $'\t'"optdepends = sway-mirror: for display mirroring support"
            echo $'\t'"source = sway-displays-${{ env.VERSION }}.tar.gz::https://github.com/pescheckit/sway-displays/archive/refs/tags/${{ env.VERSION }}.tar.gz"
            echo $'\t'"sha256sums = SKIP"
            echo ""
            echo "pkgname = sway-displays"
          } > .SRCINFO

          # Commit and push
          git config user.name "Pescheckit Bot"
          git config user.email "bram+sway@pescheck.io"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ env.VERSION }}" || echo "No changes to commit"
          git push || echo "Push failed - may need to set up AUR package first"

  verify-packages:
    name: Verify Package Installs
    needs: [create-release, update-aur]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            method: apt
          - distro: ubuntu:24.04
            method: apt
          - distro: archlinux:latest
            method: aur
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Get expected version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install from APT repository
        if: matrix.method == 'apt'
        run: |
          apt-get update
          apt-get install -y curl gnupg

          # Add signing key
          curl -fsSL https://pescheckit.github.io/sway-displays/gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/sway-displays.gpg

          # Add repository
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/sway-displays.gpg] https://pescheckit.github.io/sway-displays/apt stable main" \
            > /etc/apt/sources.list.d/sway-displays.list

          apt-get update
          apt-get install -y sway-displays

      - name: Install from AUR
        if: matrix.method == 'aur'
        run: |
          # Install build dependencies
          pacman -Syu --noconfirm base-devel git jq bc

          # makepkg cannot run as root, create a build user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # Clone and build the AUR package
          su - builder -c "
            git clone https://aur.archlinux.org/sway-displays.git /tmp/sway-displays
            cd /tmp/sway-displays
            makepkg -si --noconfirm
          "

      - name: Verify version matches
        run: |
          INSTALLED_VERSION=$(sway-displays --version 2>&1 | grep -oP '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Expected: ${{ env.VERSION }}"
          echo "Installed: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "${{ env.VERSION }}" ]; then
            echo "::error::Version mismatch! Expected ${{ env.VERSION }} but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "Version verified: $INSTALLED_VERSION"
