name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
        container:
          - null  # Use runner directly for ubuntu-*
        include:
          - os: ubuntu-24.04
            container: debian:12.15
            name: Debian Bookworm
          - os: ubuntu-24.04
            container: debian:13.7
            name: Debian Trixie
          - os: ubuntu-24.04
            container: archlinux:base-20261108.0.623074
            name: Arch Linux
          - os: ubuntu-24.04
            container: fedora:45
            name: Fedora

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    name: ${{ matrix.name || matrix.os }}

    steps:
      - name: Install dependencies (Debian/Ubuntu)
        if: matrix.container == 'debian:12.15' || matrix.container == 'debian:13.7'
        run: |
          apt-get update
          apt-get install -y bash jq bc git

      - name: Install dependencies (Arch)
        if: matrix.container == 'archlinux:base-20261108.0.623074'
        run: |
          pacman -Sy --noconfirm bash jq bc git

      - name: Install dependencies (Fedora)
        if: matrix.container == 'fedora:45'
        run: |
          dnf install -y bash jq bc git

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify bash version
        run: bash --version

      - name: Check script syntax
        run: bash -n sway-displays

      - name: Test version flag
        run: |
          ./sway-displays --version
          ./sway-displays -v

      - name: Test help command
        run: ./sway-displays help

      - name: Run shellcheck
        if: matrix.os == 'ubuntu-24.04' && matrix.container == null
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck sway-displays || true  # Don't fail on warnings

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck -S warning sway-displays

  # Same apt path as the release's install check, on every push, so mirror or
  # dependency problems show up before tagging rather than after.
  deb-install:
    name: Install .deb (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12.15']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure apt
        run: bash ci/apt.sh setup

      - name: Build .deb
        run: |
          bash ci/apt.sh install build-essential debhelper
          dpkg-buildpackage -us -uc -b

      - name: Install .deb with its dependencies
        run: bash ci/apt.sh install ../sway-displays_*_all.deb

      - name: Verify installed package
        run: |
          dpkg -s sway-displays
          sway-displays --version
